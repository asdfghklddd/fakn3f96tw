<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet"/>
<title>Private Dashboard</title>
<style>
:root{
  --bg:#f4f5fb; --panel:#ffffff; --card:#eef0f7; --text:#171923; --muted:#5f6470;
  --border:#e3e6f0; --border-strong:#d4d8e6; --accent:#4f46e5; --accent-2:#7c3aed;
  --accent-soft:#eceafd; --shadow:0 1px 2px rgba(23,25,35,.05), 0 1px 3px rgba(23,25,35,.04);
  --shadow-lg:0 10px 30px rgba(23,25,35,.10), 0 2px 6px rgba(23,25,35,.06);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Inter","SF Pro Text",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif;
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
::selection{background:#c7c4f8}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#c9cddd;border-radius:8px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

/* ---------- lock screen ---------- */
#lock{position:fixed;inset:0;z-index:99;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(1100px 500px at 20% -10%, #e6e4fb 0%, transparent 60%),
             radial-gradient(900px 500px at 90% 110%, #dcd8fa 0%, transparent 55%), var(--bg)}
.lockbox{background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:36px 30px 28px;
  width:min(360px,90vw);text-align:center;box-shadow:var(--shadow-lg)}
.lockmark{width:52px;height:52px;margin:0 auto 14px;border-radius:16px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;font-size:24px;
  box-shadow:0 8px 20px rgba(79,70,229,.35)}
.lockbox h2{margin:0 0 4px;font-size:18px;letter-spacing:.01em}
.lockbox p{margin:0 0 18px;color:var(--muted);font-size:13px}
.lockbox input{width:100%;padding:12px;border:1.5px solid var(--border-strong);border-radius:12px;font-size:18px;
  text-align:center;letter-spacing:.4em;background:#fff;color:var(--text);transition:border-color .15s, box-shadow .15s}
.lockbox input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,70,229,.15)}
.lockbox button{width:100%;margin-top:14px;padding:12px;border:none;border-radius:12px;cursor:pointer;font-size:15px;font-weight:700;
  color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 6px 16px rgba(79,70,229,.30);
  transition:transform .12s, box-shadow .12s}
.lockbox button:hover{transform:translateY(-1px);box-shadow:0 10px 22px rgba(79,70,229,.36)}
.lockbox button:active{transform:translateY(0)}
.err{color:#b91c1c;font-size:13px;margin-top:10px;min-height:18px}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* ---------- header ---------- */
.hidden{display:none!important}
.top{position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:10px 20px;border-bottom:1px solid var(--border);
  background:rgba(244,245,251,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:14.5px}
.brand .dot{width:10px;height:10px;border-radius:3px;background:linear-gradient(135deg,var(--accent),var(--accent-2));
  box-shadow:0 2px 6px rgba(79,70,229,.4)}
.upd{color:var(--muted);font-weight:500;font-size:12px;margin-left:2px}
.legend{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:6px}
.legend .lbtn{border:1px solid var(--border);background:var(--panel);border-radius:8px;padding:4px 9px;font-size:12px;cursor:pointer;color:var(--muted)}
.legend .lbtn:hover{color:var(--accent);border-color:var(--accent)}

.wrap{max-width:1280px;margin:0 auto;padding:22px 20px 64px}
.hero h1{margin:0;font-size:27px;letter-spacing:-.02em;line-height:1.25}
.hero .sub{margin-top:5px;color:var(--muted);font-size:13.5px}

/* ---------- progress ---------- */
.progress{margin:18px 0 4px;background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow)}
.pg-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.pg-head .t{font-size:13px;font-weight:700}
.pg-head .n{font-size:12px;color:var(--muted)}
.sgbar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--card);gap:2px}
.sg{border-radius:2px;min-width:6px;transition:flex .3s}
.sgbar .sg:first-child{border-radius:999px 2px 2px 999px}
.sgbar .sg:last-child{border-radius:2px 999px 999px 2px}
.sg-g{background:#cbd2df}.sg-b{background:#60a5fa}.sg-a{background:#f5b83d}.sg-o{background:#f97b4f}
.sg-v{background:#a78bfa}.sg-gr{background:#34c48c}.sg-x{background:#e11d48}
.schips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.schip{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;cursor:pointer;
  border:1px solid var(--border);background:var(--panel);font-size:12.5px;color:var(--text);transition:border-color .15s, background .15s}
.schip b{font-variant-numeric:tabular-nums}
.schip:hover{border-color:var(--border-strong)}
.schip.on{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.schip .sd{width:8px;height:8px;border-radius:999px}
.sd-g{background:#cbd2df}.sd-b{background:#60a5fa}.sd-a{background:#f5b83d}.sd-o{background:#f97b4f}
.sd-v{background:#a78bfa}.sd-gr{background:#34c48c}.sd-x{background:#e11d48}

/* ---------- filters ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);border-radius:999px;padding:6px 13px;
  font-size:13px;background:var(--panel);cursor:pointer;user-select:none;color:var(--text);transition:all .15s}
.chip .rd{width:8px;height:8px;border-radius:999px}
.chip:hover{border-color:var(--border-strong)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.panel{position:sticky;top:53px;z-index:40;display:flex;flex-wrap:wrap;gap:9px;align-items:center;
  background:rgba(255,255,255,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--border);border-radius:14px;padding:11px 12px;margin:12px 0 16px;box-shadow:var(--shadow)}
@media (prefers-color-scheme: dark){.panel{background:rgba(22,25,34,.86)}}
select,input[type=search]{padding:9px 12px;border:1px solid var(--border);border-radius:10px;background:var(--panel);
  color:var(--text);font-size:13.5px;transition:border-color .15s}
select:hover,input[type=search]:hover{border-color:var(--border-strong)}
select:focus,input[type=search]:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,70,229,.12)}
input[type=search]{flex:1;min-width:210px}
.ibtn{padding:9px 13px;border:1px solid var(--border);border-radius:10px;background:var(--panel);cursor:pointer;
  font-size:13px;color:var(--text);transition:all .15s}
.ibtn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

/* ---------- cards ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;
  box-shadow:var(--shadow);transition:transform .16s, box-shadow .16s, border-color .16s}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:#c9c6f5}
.cardhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.school{font-weight:700;font-size:16px;letter-spacing:-.01em;line-height:1.3}
.prog{color:var(--muted);font-size:13px;margin-top:3px}
.prog b{color:var(--text);font-weight:600}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.b{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;
  border:1px solid transparent;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.b.qs{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;font-weight:700;padding:3px 8px}
.b.plain{background:var(--card);color:var(--muted);border-color:var(--border);font-weight:500}
.b.t1{background:#e2f6ea;color:#0f7a43;border-color:#c8ecd8}
.b.t2{background:#dff3f5;color:#0e7490;border-color:#c2e7ec}
.b.t3{background:#ffedd8;color:#c2410c;border-color:#fbdcbc}
.b.t4{background:#fde5e5;color:#b91c1c;border-color:#f9d0d0}
.b.tc{background:#fdf6d8;color:#a16207;border-color:#f3e6ae}
.b.ts{background:#ede9fe;color:#6d28d9;border-color:#ddd2fb}
.dd{display:flex;gap:12px;align-items:flex-start;background:var(--card);border-radius:12px;padding:10px 12px}
.dd-info{flex:1;min-width:0;font-size:12.5px;display:grid;grid-template-columns:auto 1fr;gap:2px 10px}
.dd .lab{color:var(--muted)}
.dd .val{color:var(--text);word-break:break-word}
.dpill{font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums}
.dpill.hot{background:#fde5e5;color:#b91c1c}
.dpill.warn{background:#fdf0d3;color:#b45309}
.dpill.ok{background:#dcf5ea;color:#047857}
.dpill.past{background:#e8eaf0;color:#8a92a3}
.act{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:auto}
.act a{font-size:12.5px;font-weight:600;color:var(--accent);text-decoration:none;border:1px solid var(--border);
  padding:6px 12px;border-radius:9px;background:var(--panel);transition:all .15s}
.act a:hover{border-color:var(--accent);background:var(--accent-soft)}
select.st{appearance:none;-webkit-appearance:none;font-size:12.5px;font-weight:600;padding:7px 26px 7px 11px;border-radius:9px;
  border:1px solid var(--border);cursor:pointer;color:var(--text);
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%238a92a3' stroke-width='1.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 9px center}
.st-未开始{background-color:var(--panel)}
.st-调研中{background-color:#e3edfd}.st-材料准备{background-color:#fdf3d7}.st-已递交{background-color:#ffe8de}
.st-等结果{background-color:#efe9fe}.st-offer{background-color:#dcf5ea}.st-放弃{color:#8a92a3;background:var(--card)}
.prio{margin-left:auto;font-size:11.5px;color:#a0a6b5;font-variant-numeric:tabular-nums}
.tg{font-size:12.5px;color:var(--accent);cursor:pointer;background:none;border:none;padding:4px 2px;font-weight:600}
.tg .cv{display:inline-block;transition:transform .18s}
.card.open .tg .cv{transform:rotate(180deg)}
.more{border-top:1px dashed var(--border-strong);padding-top:10px;font-size:12.5px;color:#3c4254;line-height:1.7;
  display:none;white-space:pre-wrap;overflow-wrap:break-word}
.card.open .more{display:block;animation:fadein .22s ease}
@keyframes fadein{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);background:var(--panel);border:1px dashed var(--border-strong);
  border-radius:16px;padding:44px 20px;font-size:14px}
.foot{margin-top:22px;color:var(--muted);font-size:12px;text-align:center}

/* ---------- dark ---------- */
@media (prefers-color-scheme: dark){
  :root{--bg:#0d0f14;--panel:#161922;--card:#1d212c;--text:#e8eaf2;--muted:#98a0ae;--border:#262b37;
    --border-strong:#333947;--accent:#818cf8;--accent-2:#a78bfa;--accent-soft:#232741;
    --shadow:0 1px 2px rgba(0,0,0,.3);--shadow-lg:0 10px 30px rgba(0,0,0,.45)}
  ::selection{background:#3b3a70}
  ::-webkit-scrollbar-thumb{background:#333947;border-color:var(--bg)}
  #lock{background:radial-gradient(1100px 500px at 20% -10%, #1c1e33 0%, transparent 60%),
        radial-gradient(900px 500px at 90% 110%, #201d38 0%, transparent 55%), var(--bg)}
  .top{background:rgba(13,15,20,.8)}
  .lockbox{background:var(--panel)}
  .lockbox input{background:#0f1219}
  .b.t1{background:#123526;color:#4ade80;border-color:#1d4d36}
  .b.t2{background:#0e3a40;color:#2dd4bf;border-color:#16505a}
  .b.t3{background:#3d2510;color:#fb923c;border-color:#57351a}
  .b.t4{background:#3c1618;color:#f87171;border-color:#57222a}
  .b.tc{background:#3a3010;color:#fbbf24;border-color:#524416}
  .b.ts{background:#251c44;color:#b3a3fb;border-color:#362a63}
  .dd{background:var(--card)}
  .st-调研中{background-color:#14243d}.st-材料准备{background-color:#3a3010}.st-已递交{background-color:#3d2013}
  .st-等结果{background-color:#251c44}.st-offer{background-color:#0f3527}.st-未开始{background-color:var(--panel)}
  .st-放弃{color:#8a92a3;background:var(--card)}
  .dpill.hot{background:#3c1618;color:#f87171}.dpill.warn{background:#3a3010;color:#fbbf24}
  .dpill.ok{background:#0f3527;color:#34d399}.dpill.past{background:#262b37;color:#7e8595}
}
@media (max-width:640px){
  .wrap{padding:16px 12px 48px}
  .hero h1{font-size:22px}
  .grid{grid-template-columns:1fr}
  .legend span.hide-s{display:none}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
  html{scroll-behavior:auto}
}
</style>
</head>
<body>
<div id="lock">
  <div class="lockbox">
    <div class="lockmark">🔐</div>
    <h2>Private Dashboard</h2>
    <p>Access restricted · Enter passphrase</p>
    <input id="pw" type="password" inputmode="numeric" autocomplete="off" placeholder="••••••"/>
    <button id="go">Unlock</button>
    <div class="err" id="lockErr"></div>
  </div>
</div>
<header class="top hidden" id="top">
  <div class="brand"><span class="dot"></span>2027 申请看板<span class="upd">数据 2026-08-29</span></div>
  <div class="legend"><span class="hide-s">🔒 加密页面 · 状态仅存本机</span><button class="lbtn" id="lockNow">锁定</button></div>
</header>
<main class="wrap hidden" id="app">

  <section class="progress">

    <div class="sgbar" id="sgbar"></div>
    <div class="schips" id="schips"></div>
  </section>
  <div class="chips" id="regionChips"></div>
  <div class="panel">
    <input type="search" id="q" placeholder="搜索学校 / 项目 / 主题…"/>
    <select id="fTier"><option value="">全部定位</option></select>
    <select id="fFit"><option value="">全部匹配</option></select>
    <select id="fSt"><option value="">全部状态</option></select>
    <select id="sort"><option value="prio">按优先级</option><option value="days">按最近截止</option></select>
    <button class="ibtn" id="exp">导出进度</button>
    <button class="ibtn" id="imp">导入进度</button>
    <input type="file" id="impFile" accept=".json" style="display:none"/>
  </div>
  <div class="grid" id="grid"></div>
  <div class="foot" id="foot"></div>
</main>

const STS = ["未开始","调研中","材料准备","已递交","等结果","offer","放弃"];
const STC = {"未开始":"g","调研中":"b","材料准备":"a","已递交":"o","等结果":"v","offer":"gr","放弃":"x"};
const KEY = "grad2027_status_v1";
let DATA = [];
let store = {};
try{ store = JSON.parse(localStorage.getItem(KEY) || "{}"); }catch(e){}
const save = () => localStorage.setItem(KEY, JSON.stringify(store));
const esc = s => (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;");
const tierCls = t => ({"第一梯队":"t1","核心主申":"t1","第二梯队":"t2","主申偏冲":"t2","第三梯队":"t3","冲刺":"t3","第四梯队":"t4","副线主申":"t4","副线冲刺":"t4","条件型":"tc","研究特别项":"ts","重点关注":"ts"})[t]||"plain";
const REGION_DOT = {"Hong Kong":"#e11d48","Singapore":"#f59e0b","Australia":"#10b981","Mainland China":"#6366f1",
  "France":"#3b82f6","Sweden":"#06b6d4","Italy":"#84cc16","Denmark":"#ef4444","Finland":"#64748b","Austria":"#f97316"};
const DATE_RE = /20\d{2}[年\/.-]\s?\d{1,2}[月\/.-]\s?\d{1,2}/g;
function allDates(txt){ if(!txt) return []; return (txt.match(DATE_RE)||[]).map(x=>{const p=x.split(/[^0-9]/).filter(Boolean);return new Date(+p[0],+p[1]-1,+p[2]);}).filter(d=>!isNaN(d)); }
function relevantDate(d){
  const today = new Date(); today.setHours(0,0,0,0);
  const parts = allDates(d.deadline);
  const future = parts.filter(p => p >= today).sort((a,b)=>a-b);
  return future.length ? future[0] : null;
}
function daysBadge(d){
  const dt = relevantDate(d);
  if(!dt) return "";
  const approx = /[顺延预计约待]/.test(d.deadline);
  const days = Math.ceil((dt - new Date())/864e5);
  const iso = `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}-${String(dt.getDate()).padStart(2,"0")}`;
  const cls = days<=30 ? "hot" : days<=90 ? "warn" : "ok";
  return `<span class="dpill ${cls}">${approx?"≈ ":""}${days} 天 · ${iso}</span>`;
}
function tierBadge(t){ return t?`<span class="b ${tierCls(t)}">${esc(t)}</span>`:""; }
function card(d){
  const st = store[d.id]||"未开始";
  const opts = STS.map(x=>`<option ${x===st?"selected":""}>${x}</option>`).join("");
  const link = d.link?`<a href="${d.link}" target="_blank" rel="noopener">官网 ↗</a>`:"";
  const dot = REGION_DOT[d.region]||"#8a92a3";
  const trunc = (s, n) => s && s.length > n ? s.slice(0, n-1) + "…" : s;
  const feeB = d.fee ? `<span class="b plain" title="${esc(d.fee)}">💰 ${esc(trunc(d.fee, 30))}</span>` : "";
  const durB = d.dur ? `<span class="b plain" title="${esc(d.dur)}">⏱ ${esc(trunc(d.dur, 26))}</span>` : "";
  return `<div class="card" data-id="${d.id}">
    <div class="cardhead"><div style="min-width:0">
      <div class="school">${esc(d.school)}</div>
      <div class="prog"><b>${esc(d.prog)}</b> ${esc(d.prog_en)}</div>
    </div><span class="b qs">#${d.qs||"-"}</span></div>
    <div class="badges">${tierBadge(d.tier)}${d.bundle?`<span class="b tc">🎓 组合申请 P${d.pref}</span>`:""}<span class="b plain">${esc(d.fit)}</span><span class="b plain"><span class="rd" style="width:7px;height:7px;border-radius:999px;background:${dot}"></span>${esc(d.region)}</span>${feeB}${durB}</div>
    <div class="dd"><div class="dd-info"><span class="lab">开放</span><span class="val">${esc(d.open)||"-"}</span><span class="lab">截止</span><span class="val">${esc(d.deadline)||"-"}</span></div>${daysBadge(d)}</div>
    <div class="act"><select class="st st-${st}">${opts}</select>${link}<button class="tg">详情 <span class="cv">▾</span></button><span class="prio">P${d.prio}</span></div>
    <div class="more">${[d.themes&&"【主题】"+d.themes,d.req&&"【要求/风险】"+d.req,d.fit_note&&"【适配】"+d.fit_note,d.timeline&&"【时间线】"+d.timeline,d.notes&&"【备注】"+d.notes].filter(Boolean).map(esc).join("\n\n")}</div>
  </div>`;
}
let fRegion="", fQ="", fTier="", fFit="", fSt="", sortMode="prio";
function earliest(d){ const dt=relevantDate(d); return dt?dt.getTime():Infinity; }
function render(){
  let list = DATA.filter(d=>{
    if(fRegion && d.region!==fRegion) return false;
    if(fTier && d.tier!==fTier) return false;
    if(fFit && d.fit!==fFit) return false;
    if(fSt && (store[d.id]||"未开始")!==fSt) return false;
    if(fQ){ const hay=(d.school+d.prog+d.prog_en+d.themes+d.tier+d.fit).toLowerCase(); if(!hay.includes(fQ.toLowerCase())) return false; }
    return true;
  });
  list.sort(sortMode==="days" ? (a,b)=>earliest(a)-earliest(b) : (a,b)=>a.prio-b.prio);
  document.getElementById("grid").innerHTML = list.map(card).join("") ||
    `<div class="empty">当前筛选条件下没有项目 — 试试清除筛选或换个关键词</div>`;
  const rc = {}; DATA.forEach(d=>{rc[d.region]=(rc[d.region]||0)+1;});
  document.getElementById("subline").textContent = "共 " + DATA.length + " 个项目 · 2027 入学 ｜ " +
    Object.entries(rc).map(([k,v]) => k + " " + v).join(" · ") +
    " ｜ 数据更新：2026-08-30 ｜ 进度保存在本浏览器，可导出/导入";
  const cnt = {}; STS.forEach(s=>cnt[s]=0);
  DATA.forEach(d=>cnt[store[d.id]||"未开始"]++);
  document.getElementById("sgbar").innerHTML = STS.map(s=>cnt[s]?`<span class="sg sg-${STC[s]}" style="flex:${cnt[s]}" title="${s} ${cnt[s]}"></span>`:"").join("");
  document.getElementById("schips").innerHTML = STS.map(s=>`<button class="schip ${fSt===s?"on":""}" data-st="${s}"><span class="sd sd-${STC[s]}"></span>${s}<b>${cnt[s]}</b></button>`).join("");
  const done = cnt["已递交"]+cnt["等结果"]+cnt["offer"];
  document.getElementById("pgDone").textContent = `已推进 ${done} / ${DATA.length}`;
  document.getElementById("foot").textContent = "🔒 数据已加密 · 进度状态保存在当前浏览器，跨设备请用「导出 / 导入进度」 · 数据源：2027申请项目总表（" + DATA.length + " 项，2026-08-30）";
}
function initFilters(){
  const REGIONS = [...new Set(DATA.map(d=>d.region))];
  document.getElementById("regionChips").innerHTML =
    `<span class="chip on" data-r="">全部地区</span>` + REGIONS.map(r=>`<span class="chip" data-r="${r}"><span class="rd" style="background:${REGION_DOT[r]||"#8a92a3"}"></span>${r}</span>`).join("");
  document.getElementById("regionChips").addEventListener("click", e=>{
    const c = e.target.closest(".chip"); if(!c) return;
    document.querySelectorAll("#regionChips .chip").forEach(x=>x.classList.remove("on"));
    c.classList.add("on"); fRegion = c.dataset.r; render();
  });
  document.getElementById("schips").addEventListener("click", e=>{
    const c = e.target.closest(".schip"); if(!c) return;
    fSt = (fSt===c.dataset.st) ? "" : c.dataset.st;
    document.getElementById("fSt").value = fSt;
    render();
  });
  [["fTier","tier"],["fFit","fit"]].forEach(([id,key])=>{
    const el = document.getElementById(id);
    [...new Set(DATA.map(d=>d[key]))].forEach(v=>{const o=document.createElement("option");o.textContent=v;el.appendChild(o);});
  });
  const stSel = document.getElementById("fSt");
  STS.slice(1).forEach(v=>{const o=document.createElement("option");o.textContent=v;stSel.appendChild(o);});
  document.getElementById("fTier").onchange = e=>{fTier=e.target.value;render();};
  document.getElementById("fFit").onchange = e=>{fFit=e.target.value;render();};
  stSel.onchange = e=>{fSt=e.target.value;render();};
  document.getElementById("q").oninput = e=>{fQ=e.target.value.trim();render();};
  document.getElementById("sort").onchange = e=>{sortMode=e.target.value;render();};
  document.getElementById("grid").addEventListener("change", e=>{
    if(!e.target.classList.contains("st")) return;
    const cardEl = e.target.closest(".card"); const id = cardEl.dataset.id;
    store[id] = e.target.value; save();
    cardEl.querySelectorAll("select.st").forEach(s=>s.className="st st-"+e.target.value);
    render();
  });
  document.getElementById("grid").addEventListener("click", e=>{
    if(e.target.closest(".tg")) e.target.closest(".card").classList.toggle("open");
  });
  document.getElementById("exp").onclick = ()=>{
    const blob = new Blob([JSON.stringify(store,null,1)],{type:"application/json"});
    const a = document.createElement("a"); a.href=URL.createObjectURL(blob);
    a.download="progress.json"; a.click();
  };
  document.getElementById("imp").onclick = ()=>document.getElementById("impFile").click();
  document.getElementById("impFile").onchange = e=>{
    const f = e.target.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = ()=>{ try{ store = JSON.parse(rd.result); save(); render(); alert("导入成功"); }catch(x){ alert("文件格式不对"); } };
    rd.readAsText(f);
  };
  document.getElementById("lockNow").onclick = ()=>location.reload();
}
const b64ToBuf = s64 => Uint8Array.from(atob(s64), c => c.charCodeAt(0));
async function decryptVault(pass){
  const raw = typeof VAULT === "string" ? JSON.parse(VAULT) : VAULT;
  const keyMat = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name:"PBKDF2", salt: b64ToBuf(raw.s), iterations: raw.it, hash:"SHA-256" },
    keyMat, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name:"AES-GCM", iv: b64ToBuf(raw.i) }, key, b64ToBuf(raw.c));
  return JSON.parse(new TextDecoder().decode(plain));
}
async function tryUnlock(){
  const pw = document.getElementById("pw").value;
  const err = document.getElementById("lockErr");
  const box = document.querySelector(".lockbox");
  if(!pw){ err.textContent = "请输入密码"; box.classList.remove("shake"); void box.offsetWidth; box.classList.add("shake"); return; }
  err.textContent = "解密中…";
  try{
    DATA = await decryptVault(pw);
  }catch(e){
    err.textContent = "密码错误，请重试 [" + (e && e.name ? e.name : "?") + ": " + (e && e.message ? e.message : "?") + "]";
    box.classList.remove("shake"); void box.offsetWidth; box.classList.add("shake");
    return;
  }
  document.getElementById("lock").remove();
  document.getElementById("top").classList.remove("hidden");
  document.getElementById("app").classList.remove("hidden");
  document.title = "2027 研究生申请总览";
  initFilters(); render();
}
document.getElementById("go").addEventListener("click", tryUnlock);
document.getElementById("pw").addEventListener("keydown", e=>{ if(e.key==="Enter") tryUnlock(); });
document.getElementById("pw").focus();
</script>
